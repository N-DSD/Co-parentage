<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dépose &amp; Récupération</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Dépose &amp; Récupération</h1>
    <div class="names">
      <input id="name-a" type="text" maxlength="20" aria-label="Nom du premier parent" />
      <span class="vs">&amp;</span>
      <input id="name-b" type="text" maxlength="20" aria-label="Nom du deuxième parent" />
    </div>
  </header>

  <nav class="week-nav">
    <button id="prev-week" type="button">← Semaine précédente</button>
    <button id="current-week" type="button">Cette semaine</button>
    <button id="next-week" type="button">Semaine suivante →</button>
  </nav>

  <p id="week-label" class="week-label"></p>

  <section id="week-summary" class="week-summary"></section>

  <section class="activities-section">
    <h2>Activités hebdomadaires</h2>
    <div id="activities-list" class="activities-list"></div>
    <form id="activity-form" class="activity-form">
      <select id="activity-day" aria-label="Jour"></select>
      <select id="activity-kid" aria-label="Enfant">
        <option value="Z">Z</option>
        <option value="W">W</option>
      </select>
      <input id="activity-name" type="text" maxlength="30" placeholder="Activité" required />
      <input id="activity-start" type="time" required aria-label="Début" />
      <input id="activity-end" type="time" required aria-label="Fin" />
      <button type="submit">Ajouter</button>
    </form>
  </section>

  <main id="days" class="days"></main>

  <footer class="app-footer">
    <button id="export-btn" type="button">Exporter (JSON)</button>
    <label class="import-label">
      Importer (JSON)
      <input id="import-input" type="file" accept="application/json,.json" hidden />
    </label>
  </footer>

  <script src="app.js"></script>
</body>
</html>
